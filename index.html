<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liga NBA 2K · ELO</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>

main{max-width:1100px;margin:auto;padding:0 20px 60px}section{display:none}section.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--line)}td{border-bottom:1px solid #1b3559}
.big{font:700 28px/1 'Barlow Condensed',sans-serif;color:var(--gold)}.w{color:var(--w)}.l{color:var(--l)}.mut{color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.f{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px}.f.W{background:var(--w)}.f.L{background:var(--l)}
.cv{position:relative;height:380px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.kp b{display:block;font:700 30px/1.1 'Barlow Condensed',sans-serif}.kp small{color:var(--mut)}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;margin-right:8px}
.mx td{text-align:center;min-width:64px}.mx th{text-align:center}.mx td.na{color:var(--line)}
.pr{display:flex;height:44px;border-radius:6px;overflow:hidden;font:700 24px/44px 'Barlow Condensed',sans-serif;margin:16px 0}
.pr div{padding:0 12px;color:#0c1b33;min-width:48px}
#awd{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.aw{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.aw .em{font-size:30px;line-height:1}.aw h4{font:700 22px/1.1 'Barlow Condensed',sans-serif;margin:6px 0 2px;color:var(--gold)}
.aw small{display:block}.aw .wn{font:700 28px/1.2 'Barlow Condensed',sans-serif;margin-top:8px}.sm{font-size:13px;margin-top:6px}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer}
.seg button.on{background:var(--gold);color:#0c1b33;border-color:var(--gold);font-weight:700}
.sqs .f{width:14px;height:14px;margin-right:4px;border-radius:3px}
#err{color:var(--l);padding:20px;max-width:1100px;margin:auto}
</style></head><body>
<header><h1>Liga NBA 2K <span>ELO</span></h1><p class="sub" id="meta">Cargando partidos…</p></header>
<nav id="nav"></nav><div id="err"></div>
<main>
<section id="s-rank"><div class="box" id="rank"></div><div class="box"><h3 style="margin-top:0">Últimos partidos</h3><div id="rec"></div></div></section>
<section id="s-elo"><div class="box"><div class="cv"><canvas id="c-elo"></canvas></div></div></section>
<section id="s-stats"><div class="box" id="stats"></div><div class="box" id="pos"></div></section>
<section id="s-form"><div class="seg" id="fseg"></div><div class="box" id="form"></div></section>
<section id="s-perf"><div class="box" id="pf-a"></div><div class="box" id="pf-d"></div><div class="box" id="pf-n"></div><div class="box" id="pf-c"></div></section>
<section id="s-wins"><div class="box" id="wq1"></div><div class="box" id="wq2"></div></section>
<section id="s-awd"><div id="awd"></div></section>
<section id="s-h2h"><div class="box" id="h2h"></div><div class="box" id="duel"></div></section>
<section id="s-prof"><select id="sel-p" aria-label="Jugador"></select><div id="prof" style="margin-top:16px"></div></section>
<section id="s-pred"><select id="pa" aria-label="Jugador A"></select><select id="pb" aria-label="Jugador B"></select><div id="pred"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const SUPABASE_URL='https://snicjtufgmlpmtdzpilh.supabase.co', SUPABASE_KEY='sb_publishable_qxeblvVBOMtG8mhXv_FoIQ_QEhcP44T';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const PAL=['#ffd23f','#4cc9f0','#5fd39a','#ff6b6b','#c77dff','#ff9f1c','#2ec4b6','#f15bb5','#b8c0d4'];
const $=s=>document.querySelector(s),pc=(a,b)=>b?Math.round(100*a/b):0,sg=n=>n>0?'+'+n:''+n;
let P={},M=[],CH={},ids=[],WL=[];
async function all(t){let o=[],f=0;for(;;){const{data,error}=await sb.from(t).select('*').range(f,f+999);if(error)throw error;o.push(...data);if(data.length<1000)break;f+=1000}return o}
function build(pl,H){
 M.sort((a,b)=>new Date(a.played_at)-new Date(b.played_at)||a.match_id-b.match_id);
 pl.forEach((p,i)=>P[p.player_id]={id:p.player_id,name:p.name,active:p.active,color:PAL[i%PAL.length],g:0,w:0,l:0,pf:0,pa:0,hg:0,hw:0,hpf:0,hpa:0,ag:0,aw:0,apf:0,apa:0,rk:{},sc:[],al:[],wq:[0,0,0,0],worst:null,ud:[0,0],fv:[0,0],gi:null,c3:[0,0],fd:[],cl:[0,0],bl:[0,0],form:[],str:0,mw:0,ml:0,best:null,h2h:{},elo:1500,peak:0,last:0,curve:[]});
 const E={};H.forEach(h=>E[h.match_id+'|'+h.player_id]=h);
 const cur={},seen=new Set();pl.forEach(p=>cur[p.player_id]=1500);
 M.forEach((m,i)=>{m.n=i+1;
  seen.add(m.player1_id);seen.add(m.player2_id);
  const ord=[...seen].sort((x,y)=>cur[y]-cur[x]||P[x].name.localeCompare(P[y].name));
  [m.player1_id,m.player2_id].forEach(id=>{const r=ord.indexOf(id)+1;P[id].rk[r]=(P[id].rk[r]||0)+1});
  [[m.player1_id,m.score1,m.player2_id,m.score2],[m.player2_id,m.score2,m.player1_id,m.score1]].forEach(([a,sa,b,sb_],ix)=>{
   const p=P[a],d=sa-sb_,win=d>0,ad=Math.abs(d);p.g++;p.pf+=sa;p.pa+=sb_;if(ix===0){p.hg++;p.hpf+=sa;p.hpa+=sb_;if(win)p.hw++}else{p.ag++;p.apf+=sa;p.apa+=sb_;if(win)p.aw++}win?p.w++:p.l++;p.form.push(win?'W':'L');p.fd.push(d);p.sc.push(sa);p.al.push(sb_);if(!win&&(!p.worst||d<p.worst.d))p.worst={d,opp:b,sa,sb:sb_};
   if(ad<=3)p.c3[win?0:1]++;if(ad<=5)p.cl[win?0:1]++;if(ad>=20)p.bl[win?0:1]++;
   p.str=win?(p.str>0?p.str+1:1):(p.str<0?p.str-1:-1);p.mw=Math.max(p.mw,p.str);p.ml=Math.max(p.ml,-p.str);
   if(win&&(!p.best||d>p.best.d))p.best={d,opp:b,sa,sb:sb_};
   const h=p.h2h[b]||(p.h2h[b]={w:0,l:0,d:0,s:0,mx:0,lw:null});win?h.w++:h.l++;h.d+=d;h.s=win?(h.s>0?h.s+1:1):(h.s<0?h.s-1:-1);h.mx=Math.max(h.mx,h.s);if(win)h.lw=m.played_at;
   const ea=E[m.match_id+'|'+a],eb=E[m.match_id+'|'+b];
   if(ea&&eb){const q=1/(1+10**((eb.elo_before-ea.elo_before)/400));if(q<.5){p.ud[1]++;if(win)p.ud[0]++}else if(q>.5){p.fv[1]++;if(win)p.fv[0]++}if(win&&(!p.gi||q<p.gi.pr))p.gi={pr:q,opp:b,sa,sb:sb_};if(win){const ed=ea.elo_before-eb.elo_before,k=ed>50?0:ed>=-50?1:ed>=-200?2:3;p.wq[k]++;WL.push({date:m.played_at,a,b,sa,sb:sb_,ed,k})}}
   const e=E[m.match_id+'|'+a];if(e){cur[a]=e.elo_after;p.elo=e.elo_after;p.last=e.elo_change;p.peak=Math.max(p.peak,e.elo_before,e.elo_after);p.curve.push({x:m.n,y:e.elo_after})}
  })})}
const act=()=>Object.values(P).filter(p=>p.g).sort((a,b)=>b.elo-a.elo);
const avg=(a,g)=>g?(a/g).toFixed(1):'–',vd=(w,g)=>g?`${w}-${g-w} (${pc(w,g)}%)`:'–';
function rank(){
 $('#rank').innerHTML='<table><tr><th>#</th><th>Jugador</th><th>ELO</th><th>Último</th><th>PJ</th><th>V-D</th><th>%V</th><th>Local</th><th>Visita</th><th>Dif. pts</th></tr>'+
 act().map((p,i)=>`<tr><td>${i+1}</td><td><i class="dot" style="background:${p.color}"></i>${p.name}</td><td class="big">${p.elo}</td><td class="${p.last>=0?'w':'l'}">${sg(p.last)}</td><td>${p.g}</td><td>${p.w}-${p.l}</td><td>${pc(p.w,p.g)}%</td><td>${vd(p.hw,p.hg)}</td><td>${vd(p.aw,p.ag)}</td><td>${sg(p.pf-p.pa)}</td></tr>`).join('')+'</table>';
 $('#rec').innerHTML='<table>'+M.slice(-12).reverse().map(m=>{const a=P[m.player1_id],b=P[m.player2_id],w=m.score1>m.score2;
  return `<tr><td class="mut">${new Date(m.played_at).toLocaleDateString('es-AR')}</td><td class="${w?'w':''}">${a.name} ${m.score1}</td><td class="${w?'':'w'}">${m.score2} ${b.name}</td></tr>`}).join('')+'</table>'}
function line(id,sets){CH[id]?.destroy();const g={color:'#24406b'},t={color:'#8fa3c2'};
 CH[id]=new Chart($('#'+id),{type:'line',data:{datasets:sets},options:{parsing:false,animation:false,responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
 scales:{x:{type:'linear',title:{display:true,text:'Partido #',color:'#8fa3c2'},grid:g,ticks:t},y:{grid:g,ticks:t}},plugins:{legend:{labels:{color:'#eef2f8'}}},elements:{point:{radius:0},line:{borderWidth:2,tension:.2}}}})}
const ds=p=>({label:p.name,data:p.curve,borderColor:p.color});
function h2h(){const r=act();
 $('#h2h').innerHTML='<table class="mx"><tr><th></th>'+r.map(p=>`<th>${p.name}</th>`).join('')+'</tr>'+r.map(a=>`<tr><th style="text-align:left">${a.name}</th>`+r.map(b=>{
  const h=a.h2h[b.id];if(a===b||!h)return'<td class="na">–</td>';const t=h.w+h.l,v=h.w/t;
  return `<td style="background:hsl(${Math.round(v*120)} 45% 26%)" title="Dif. medio ${(h.d/t).toFixed(1)} pts">${h.w}-${h.l}</td>`}).join('')+'</tr>').join('')+'</table><p class="mut">Victorias-derrotas de la fila contra la columna. Pasá el mouse para ver la diferencia media de puntos.</p>'}
function prof(id){const p=P[id];if(!p)return;const R=Object.entries(p.h2h).map(([i,h])=>({n:P[i].name,...h,t:h.w+h.l})).sort((a,b)=>b.t-a.t);
 const k=[['ELO',p.elo],['ELO máximo',p.peak],['Récord',p.w+'-'+p.l],['% victorias',pc(p.w,p.g)+'%'],['Pts a favor',(p.pf/p.g).toFixed(1)],['Pts en contra',(p.pa/p.g).toFixed(1)],['Mejor racha','V'+p.mw],['Peor racha','D'+p.ml],['Parejos (≤5)',p.cl[0]+'-'+p.cl[1]],['Palizas (≥20)',p.bl[0]+'-'+p.bl[1]],['Mejor victoria',p.best?`+${p.best.d} vs ${P[p.best.opp].name}`:'–']];
 $('#prof').innerHTML='<div class="kp">'+k.map(([a,b])=>`<div><small>${a}</small><b>${b}</b></div>`).join('')+'</div><div class="box"><div class="cv" style="height:260px"><canvas id="c-p"></canvas></div></div><div class="box"><table><tr><th>Rival</th><th>V-D</th><th>%V</th><th>Dif. medio</th></tr>'+R.map(r=>`<tr><td>${r.n}</td><td>${r.w}-${r.l}</td><td>${pc(r.w,r.t)}%</td><td class="${r.d>=0?'w':'l'}">${sg((r.d/r.t).toFixed(1))}</td></tr>`).join('')+'</table></div>';
 line('c-p',[ds(p)])}
function pred(){const a=P[$('#pa').value],b=P[$('#pb').value];if(!a||!b||a===b){$('#pred').innerHTML='<p class="mut">Elegí dos jugadores distintos.</p>';return}
 const pa=1/(1+10**((b.elo-a.elo)/400)),h=a.h2h[b.id],A=Math.round(pa*100);
 $('#pred').innerHTML=`<div class="pr"><div style="width:${A}%;background:${a.color}">${a.name} ${A}%</div><div style="width:${100-A}%;background:${b.color}">${100-A}% ${b.name}</div></div><p class="mut">Probabilidad con la fórmula ELO estándar (escala 400): ${a.elo} vs ${b.elo}. ${h?`Historial directo: ${h.w}-${h.l}, diferencia media ${sg((h.d/(h.w+h.l)).toFixed(1))} pts para ${a.name}.`:'Todavía no jugaron entre sí.'}</p>`}
const df=(a,b,g)=>g?`<td class="${a>=b?'w':'l'}">${sg(((a-b)/g).toFixed(1))}</td>`:'<td>–</td>';
const nm=p=>`<td><i class="dot" style="background:${p.color}"></i>${p.name}</td>`;
function stats(){const r=act();
 $('#stats').innerHTML='<table><tr><th rowspan="2">Jugador</th><th colspan="4">Todos los partidos</th><th colspan="3">De local</th><th colspan="3">De visita</th></tr><tr><th>Anot.</th><th>Rec.</th><th>Dif.</th><th>Dif. total</th><th>Anot.</th><th>Rec.</th><th>Dif.</th><th>Anot.</th><th>Rec.</th><th>Dif.</th></tr>'+
 r.map(p=>`<tr>${nm(p)}<td>${avg(p.pf,p.g)}</td><td>${avg(p.pa,p.g)}</td>${df(p.pf,p.pa,p.g)}<td class="${p.pf>=p.pa?'w':'l'}">${sg(p.pf-p.pa)}</td><td>${avg(p.hpf,p.hg)}</td><td>${avg(p.hpa,p.hg)}</td>${df(p.hpf,p.hpa,p.hg)}<td>${avg(p.apf,p.ag)}</td><td>${avg(p.apa,p.ag)}</td>${df(p.apf,p.apa,p.ag)}</tr>`).join('')+'</table><p class="mut">Promedios por partido. Dif. = anotados menos recibidos por partido.</p>';
 $('#pos').innerHTML='<h3 style="margin-top:0">Partidos jugados según el puesto en el ranking</h3><table><tr><th>Jugador</th><th>Como N°1</th><th>Como N°4</th></tr>'+r.map(p=>`<tr>${nm(p)}<td>${p.rk[1]||0}</td><td>${p.rk[4]||0}</td></tr>`).join('')+'</table><p class="mut">Puesto por ELO justo antes de cada partido; si hay empate se ordena por nombre.</p>'}
function duels(){const r=act(),f=d=>d?new Date(d).toLocaleDateString('es-AR'):'–',rows=[];
 r.forEach((a,i)=>r.slice(i+1).forEach(b=>{const x=a.h2h[b.id],y=b.h2h[a.id];if(!x||!y)return;
  const n=Math.abs(x.s),w=x.s>0?a:b;
  const l5=M.filter(m=>(m.player1_id===a.id&&m.player2_id===b.id)||(m.player1_id===b.id&&m.player2_id===a.id)).slice(-5).map(m=>{const as=m.player1_id===a.id?m.score1:m.score2,bs=m.player1_id===a.id?m.score2:m.score1;return as>bs?'W':'L'});
  rows.push(`<tr><td>${a.name} vs ${b.name}</td><td>${x.w}-${x.l}</td><td>${w.name} · ${n} ${n>1?'victorias seguidas':'victoria'}</td><td>${a.name}: ${f(x.lw)}<br>${b.name}: ${f(y.lw)}</td><td>${a.name}: ${x.mx}<br>${b.name}: ${y.mx}</td><td class="sqs">${a.name} ${sq(l5)}</td></tr>`)}));
 $('#duel').innerHTML='<h3 style="margin-top:0">Rachas por duelo</h3><table><tr><th>Duelo</th><th>V-D</th><th>Racha actual</th><th>Última victoria</th><th>Máxima racha</th><th>Últimos 5</th></tr>'+rows.join('')+'</table><p class="mut">Últimos 5 duelos vistos desde el primer jugador de cada fila (verde = ganó, rojo = perdió). El más reciente va a la derecha.</p>'}
function awards(){const r=act();
 const L10=p=>p.form.slice(-10).filter(x=>x==='W').length,D10=p=>p.fd.slice(-10).reduce((a,b)=>a+b,0);
 const loc=p=>p.hg&&p.ag?pc(p.hw,p.hg)-pc(p.aw,p.ag):null;
 const c3=p=>p.c3[0]+p.c3[1]>=5?p.c3[0]/(p.c3[0]+p.c3[1]):null,c3t=p=>`${pc(p.c3[0],p.c3[0]+p.c3[1])}% (${p.c3[0]} de ${p.c3[0]+p.c3[1]})`;
 const A=[
 ['👑','Mejor ELO','El más alto hoy',p=>p.elo,1,p=>p.elo+' puntos'],
 ['🏆','Mayor % de victorias','',p=>p.w/p.g,1,p=>`${pc(p.w,p.g)}% (${p.w}-${p.l})`],
 ['📈','Mayor diferencial','Diferencia de puntos por partido',p=>(p.pf-p.pa)/p.g,1,p=>`${sg(((p.pf-p.pa)/p.g).toFixed(1))} por partido (${sg(p.pf-p.pa)} total)`],
 ['🔥','Mejor forma','Últimos 10 partidos',p=>L10(p)*1000+D10(p),1,p=>`${L10(p)}-${10-L10(p)} · ${sg(D10(p))} pts`],
 ['⚔️','Mejor ataque','Más puntos anotados por partido',p=>p.pf/p.g,1,p=>avg(p.pf,p.g)+' por partido'],

 ['🏹','Cazador de gigantes','La victoria más improbable según el ELO',p=>p.gi?-p.gi.pr:null,1,p=>`${Math.round(p.gi.pr*100)}% de probabilidad · ${p.gi.sa}-${p.gi.sb} a ${P[p.gi.opp].name}`,p=>Math.round(p.gi.pr*100)+'%'],

 ['🧳','Turista','Mayor caída de % de victorias de local a visita',loc,1,p=>`Local ${pc(p.hw,p.hg)}% · Visita ${pc(p.aw,p.ag)}%`,p=>sg(loc(p))+' pts']];
 $('#awd').innerHTML=A.map(([e,t,d,f,hi,fm,sh])=>{

  const w=rk[0].p;
  return `<div class="aw"><div class="em">${e}</div><h4>${t}</h4><small class="mut">${d}</small><div class="wn"><i class="dot" style="background:${w.color}"></i>${w.name}</div><div>${fm(w)}</div><div class="mut sm">${rk.slice(1).map(x=>`${x.p.name} ${sh?sh(x.p):fm(x.p).split(' ')[0]}`).join(' · ')}</div></div>`}).join('')}
const med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2},
sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)},
pct=(a,f)=>a.length?Math.round(100*a.filter(f).length/a.length)+'%':'–',
tb=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table>`,
cl=(n,t)=>`<td class="${n>=0?'w':'l'}">${t}</td>`,
res=x=>x?`${sg(x.d)} <span class="mut">(${x.sa}-${x.sb} vs ${P[x.opp].name})</span>`:'–';
function perf(){const r=act(),T=r.reduce((a,p)=>a+p.pf,0)/r.reduce((a,p)=>a+p.g,0),H=t=>`<h3 style="margin-top:0">${t}</h3>`;
 $('#pf-a').innerHTML=H('🔥 Ataque')+tb(['Jugador','PPG','Máximo anotador','Mediana','% partidos >30','% partidos >35','% partidos >40'],r.map(p=>`<tr>${nm(p)}<td>${avg(p.pf,p.g)}</td><td>${Math.max(...p.sc)}</td><td>${med(p.sc)}</td><td>${pct(p.sc,x=>x>30)}</td><td>${pct(p.sc,x=>x>35)}</td><td>${pct(p.sc,x=>x>40)}</td></tr>`));
 $('#pf-d').innerHTML=H('🛡️ Defensa')+tb(['Jugador','PAPG','% permitiendo ≤25','% permitiendo ≤30','Menos recibidos','Dif. defensiva'],r.map(p=>`<tr>${nm(p)}<td>${avg(p.pa,p.g)}</td><td>${pct(p.al,x=>x<=25)}</td><td>${pct(p.al,x=>x<=30)}</td><td>${Math.min(...p.al)}</td>${cl(T-p.pa/p.g,sg((T-p.pa/p.g).toFixed(1)))}</tr>`))+`<p class="mut">Dif. defensiva = promedio de la liga (${T.toFixed(1)}) menos los puntos que recibe por partido; positivo = mejor que el promedio.</p>`;
 $('#pf-n').innerHTML=H('📊 Diferencial (net rating simplificado)')+tb(['Jugador','Por partido','Total','De local','De visita'],r.map(p=>`<tr>${nm(p)}${df(p.pf,p.pa,p.g)}${cl(p.pf-p.pa,sg(p.pf-p.pa))}${df(p.hpf,p.hpa,p.hg)}${df(p.apf,p.apa,p.ag)}</tr>`))+'<p class="mut">Puntos anotados menos puntos recibidos.</p>';
 $('#pf-c').innerHTML=H('🎚️ Consistencia')+tb(['Jugador','Desv. est. de puntos','Desv. est. de la diferencia','% dentro de ±5 de su promedio','Peor derrota','Mejor victoria'],r.map(p=>{const m=p.pf/p.g;return `<tr>${nm(p)}<td>${sd(p.sc).toFixed(1)}</td><td>${sd(p.fd).toFixed(1)}</td><td>${pct(p.sc,x=>Math.abs(x-m)<=5)}</td><td>${res(p.worst)}</td><td>${res(p.best)}</td></tr>`}))+'<p class="mut">Menor desviación = más estable. El % dentro de ±5 se mide sobre los puntos anotados.</p>'}
const QB=[['🟢','Esperadas'],['🔵','Sólidas'],['🟣','Upsets'],['🔴','Grandes upsets']];
function wins(){const r=act();
 $('#wq1').innerHTML='<h3 style="margin-top:0">Calidad de victoria</h3>'+tb(['Jugador','Victorias',...QB.map(([e,t])=>`${e} ${t}`)],r.map(p=>{const t=p.wq.reduce((a,b)=>a+b,0);return `<tr>${nm(p)}<td>${t}</td>${p.wq.map(n=>`<td>${n} <span class="mut">(${pc(n,t)}%)</span></td>`).join('')}</tr>`}))+'<p class="mut">Según la diferencia de ELO antes del partido: 🟢 favorito por más de 50 · 🔵 rival parejo (±50) · 🟣 underdog por 50 a 200 · 🔴 underdog por más de 200.</p>';
 $('#wq2').innerHTML='<h3 style="margin-top:0">Últimas victorias</h3><table>'+WL.slice(-15).reverse().map(x=>`<tr><td class="mut">${new Date(x.date).toLocaleDateString('es-AR')}</td><td>${QB[x.k][0]}</td><td>${P[x.a].name} ${x.sa}-${x.sb} a ${P[x.b].name}</td><td class="mut">ELO ${sg(x.ed)}</td></tr>`).join('')+'</table>'}
const sq=F=>F.map(x=>`<b class="f ${x}"></b>`).join('');
let FN=10;
function forma(){
 const r=act().map(p=>{const n=Math.min(FN,p.form.length),F=p.form.slice(-n),D=p.fd.slice(-n),w=F.filter(x=>x==='W').length,c=p.curve;
  return{p,n,F,w,dd:D.reduce((a,b)=>a+b,0),de:c.length>n?p.elo-c[c.length-n-1].y:null}}).sort((a,b)=>b.w/b.n-a.w/a.n||b.dd-a.dd);
 $('#fseg').innerHTML=[5,10,20].map(k=>`<button data-n="${k}" class="${k===FN?'on':''}">Últimos ${k}</button>`).join('');
 $('#form').innerHTML='<table><tr><th>#</th><th>Jugador</th><th>Racha actual</th><th>V-D</th><th>%V</th><th>Dif. por partido</th><th>Δ ELO</th><th>Resultados</th></tr>'+
 r.map((x,i)=>`<tr><td>${i+1}</td>${nm(x.p)}<td class="${x.p.str>0?'w':'l'}">${x.p.str>0?'V'+x.p.str:'D'+-x.p.str}</td><td>${x.w}-${x.n-x.w}</td><td>${pc(x.w,x.n)}%</td><td class="${x.dd>=0?'w':'l'}">${sg((x.dd/x.n).toFixed(1))}</td>${x.de===null?'<td>–</td>':`<td class="${x.de>=0?'w':'l'}">${sg(x.de)}</td>`}<td class="sqs">${sq(x.F)}</td></tr>`).join('')+'</table><p class="mut">La racha actual no depende del filtro. Resultados: el más reciente va a la derecha.</p>'}
$('#fseg').onclick=e=>{if(e.target.dataset.n){FN=+e.target.dataset.n;forma()}};
const TABS=[['rank','Ranking'],['form','Forma'],['elo','Evolución ELO'],['stats','Estadísticas'],['perf','Rendimiento'],['wins','Victorias'],['awd','Premios'],['h2h','Cara a cara'],['prof','Jugador'],['pred','Predictor']];
$('#nav').innerHTML=TABS.map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('');
function tab(k){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+k));
 if(k==='elo')line('c-elo',act().map(ds));if(k==='prof')prof($('#sel-p').value)}
$('#nav').onclick=e=>e.target.dataset.k&&tab(e.target.dataset.k);
$('#sel-p').onchange=e=>prof(e.target.value);$('#pa').onchange=$('#pb').onchange=pred;
(async()=>{try{
 const[pl,m,h]=await Promise.all([all('players'),all('matches'),all('elo_history')]);M=m;build(pl,h);ids=act();
 const o=ids.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('#sel-p').innerHTML=$('#pa').innerHTML=$('#pb').innerHTML=o;if(ids[1])$('#pb').value=ids[1].id;
 $('#meta').textContent=`${M.length} partidos · ${ids.length} jugadores · actualizado ${new Date(M[M.length-1].played_at).toLocaleDateString('es-AR')}`;
 rank();forma();stats();perf();wins();awards();h2h();duels();pred();tab('rank')
}catch(e){$('#meta').textContent='';$('#err').textContent='No se pudieron cargar los datos: '+(e.message||e)+'. Revisá la URL, la anon key y las políticas RLS de lectura.'}})();
</script></body></html>
